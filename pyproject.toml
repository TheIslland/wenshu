[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wenshu"
version = "0.1.0"
description = "文枢 Wenshu —— 本地优先的中文文科科研文献与写作工作台"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "TheIslland" }]
keywords = ["humanities", "research", "literature", "writing", "chinese", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "platformdirs>=4.2",
  "pyalex>=0.21",
  "habanero>=2.9",
  "arxiv>=2.1",
  "semanticscholar>=0.12",
  "citeproc-py>=0.12",
  "lxml>=5.0",
  "bibtexparser>=2.0",
  "rispy>=0.10",
  "pypdf>=5.0",
  "jieba>=0.42",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.6", "pytest-cov>=5.0"]

[project.scripts]
wenshu = "wenshu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wenshu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/wenshu/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
